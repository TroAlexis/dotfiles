gui:
  nerdFontsVersion: "3"

git:
  pagers:
    - pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

    # difft has no themes, only ANSI colours. "light" picks slots 1-4 (Material Darker's own
    # red/green/yellow/blue in Ghostty) over the brightened 9-12 it uses on dark backgrounds.
    - externalDiffCommand: difft --color=always --display=inline --background light

    - pager: delta --dark --paging=never --side-by-side --width={{columnWidth}}

os:
  # 'e' открывает файл буфером в текущем окне neovim, а не в новой вкладке
  # (по умолчанию nvim-remote пресет делает --remote-tab).
  # Вне neovim ($NVIM пуст) поведение прежнее: запуск свежего nvim.
  editPreset: nvim-remote
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
