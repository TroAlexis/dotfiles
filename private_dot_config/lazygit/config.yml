gui:
  nerdFontsVersion: "3"
  scrollHeight: 4

git:
  pagers:
    - pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

    # difft has no themes, only ANSI colours. "light" picks slots 1-4 (Material Darker's own
    # red/green/yellow/blue in Ghostty) over the brightened 9-12 it uses on dark backgrounds.
    - externalDiffCommand: difft --color=always --display=inline --background light

    - pager: delta --dark --paging=never --side-by-side --width={{columnWidth}}

os:
  # 'e' открывает файл буфером в текущем окне neovim, а не в новой вкладке
  # (по умолчанию nvim-remote пресет делает --remote-tab).
  # Вне neovim ($NVIM пуст) поведение прежнее: запуск свежего nvim.
  editPreset: nvim-remote
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'

# codediff.sh returns to lazygit on its own (nvim quit, or a tab in the host nvim)
promptToReturnFromSubprocess: false

customCommands:
  - key: <c-v>
    context: files
    description: CodeDiff working tree
    command: ~/.config/lazygit/codediff.sh
    output: terminal
  - key: <c-v>
    context: commits
    description: CodeDiff commit
    command: ~/.config/lazygit/codediff.sh {{.SelectedLocalCommit.Sha}}~ {{.SelectedLocalCommit.Sha}}
    output: terminal
  - key: <c-v>
    context: localBranches
    description: CodeDiff working tree vs branch
    command: ~/.config/lazygit/codediff.sh {{.SelectedLocalBranch.Name}}
    output: terminal
  - key: <c-g>
    description: GitLab
    commandMenu:
      - key: o
        context: localBranches
        description: Open MR
        command: glab mr view {{.SelectedLocalBranch.Name | quote}} --web
      - key: c
        context: localBranches
        description: Create MR (pushes branch)
        command: glab mr create --fill --web --source-branch {{.SelectedLocalBranch.Name | quote}}
      - key: p
        context: localBranches
        description: Open pipeline
        command: open "$(glab ci get --branch {{.SelectedLocalBranch.Name | quote}} -F json --jq .web_url)"
      - key: b
        context: localBranches
        description: Open branch in browser
        command: glab repo view --web --branch {{.SelectedLocalBranch.Name | quote}}
      - key: r
        context: localBranches
        description: Open MR review (diffs)
        command: open "$(glab mr view {{.SelectedLocalBranch.Name | quote}} -F json --jq .web_url)/diffs"
