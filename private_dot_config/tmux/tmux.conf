# Leader
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vim-like motions
set -g mode-keys vi
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R

# Resize panes
bind -N "Resize pane left" -r H resize-pane -L 10
bind -N "Resize pane down" -r J resize-pane -D 10
bind -N "Resize pane up" -r K resize-pane -U 10
bind -N "Resize pane right" -r L resize-pane -R 10

# Agentic layout: creates panes if needed, then applies layout
# Left pane 65%, right pane 35%
bind-key -N "Agentic layout" P run-shell ~/.config/tmux/scripts/setup-agentic-layout.sh

# Pane splits (mnemonic: v=vertical split, s=split horizontal)
bind-key -N "Split horizontal" v split-window -h
bind-key -N "Split vertical" s split-window -v

# New window in current directory
bind -N "New window (cwd)" c new-window -c "#{pane_current_path}"

# Status bar on top
set -g status-position top

# Mouse
set -g mouse on

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g allow-passthrough on

set -g default-terminal "tmux-256color"
set -s terminal-features[3] 'xterm-ghostty:hyperlinks'
set -g extended-keys on
set -g extended-keys-format csi-u
setw -g xterm-keys on

# --- Heavy borders + active pane background ---
set -g pane-border-lines heavy
set -g window-active-style 'bg=#1e1e2e'

# --- Catppuccin theme ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_text_color "default"
set -g @catppuccin_window_current_text_color "default"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_session_text " #S"
set -g @catppuccin_menu_selected_style "fg=#{@thm_bg},bold,bg=#{@thm_mauve}"
# Clear cached current window separators so catppuccin rebuilds them as basic
set -Ug @catppuccin_window_current_left_separator
set -Ug @catppuccin_window_current_right_separator
set -Ug @catppuccin_window_current_middle_separator
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# Menus + popups: catppuccin only sets the selected row and popup colours
set -gF menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF menu-border-style "fg=#{@thm_surface_1}"
set -g menu-border-lines rounded
set -g popup-border-lines rounded

# Padding: empty line below status bar
set -g status 2
set -g 'status-format[1]' ''

# Status modules
set -g status-right-length 100
set -g status-left ""
set -g @catppuccin_directory_text ' #(~/.config/tmux/scripts/abbrev-path.sh "#{pane_current_path}")'
set -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_session}"

# --- Sesh (session manager) ---
bind-key -N "Kill pane" x kill-pane  # skip "kill-pane ?" prompt
set -g detach-on-destroy off  # don't exit tmux when last session closes
bind -N "last-session" C-l run-shell "sesh last"
bind-key -N "Sesh: pick session" t run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 80%,70% \\
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \\
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \\
    --bind 'tab:down,btab:up' \\
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \\
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \\
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \\
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \\
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \\
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \\
    --preview-window 'right:55%' \\
    --preview 'sesh preview {}'
)\""
bind-key -N "Window picker" "W" run-shell ~/.config/tmux/scripts/window-picker.sh

# --- TPM plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'loichyan/tmux-toggle-popup'
set -g @plugin 'laktak/extrakto'
set -g @extrakto_filter_order 'word path url quote s-quote all line'
set -g @extrakto_alt 'any'

# Continuum: auto-restore last session
set -g @continuum-restore 'on'

# Resurrect: restore nvim session (requires persistence.nvim)
set -g @resurrect-strategy-nvim 'session'

# Resurrect: capture pane contents (scrollback buffer)
set -g @resurrect-capture-pane-contents 'on'

# Toggle popup: do not autostart a separate tmux server, so continuum can inject autosave on reload
set -g @popup-autostart off

# Toggle popup: share popups by project directory
set -gF @popup-id-format '#{b:pane_current_path}/{popup_name}'

# Toggle popup bindings
unbind -n M-t
bind-key -N "Toggle popup shell (cwd)" C-t run "#{@popup-toggle} -w50% -h50% -Ed'##{pane_current_path}' --toggle-key '-n C-t'"

# --- Russian layout mirrors (same physical key, ЙЦУКЕН) ---
# Fallback prefix in case Ghostty reports Ctrl+ф instead of ^A under csi-u
set -g prefix2 C-ф
bind C-ф send-prefix
# Mirrors forward to the Latin binding, so they never go stale
bind р send-keys -K C-a h
bind о send-keys -K C-a j
bind л send-keys -K C-a k
bind д send-keys -K C-a l
bind -r Р resize-pane -L 10
bind -r О resize-pane -D 10
bind -r Л resize-pane -U 10
bind -r Д resize-pane -R 10
bind З send-keys -K C-a P
bind м send-keys -K C-a v
bind ы send-keys -K C-a s
bind с send-keys -K C-a c
bind ч send-keys -K C-a x
bind е send-keys -K C-a t
bind Ц send-keys -K C-a W
bind C-д send-keys -K C-a C-l
bind C-е send-keys -K C-a C-t
bind т send-keys -K C-a n
bind з send-keys -K C-a p
bind ц send-keys -K C-a w
bind в send-keys -K C-a d
bind я send-keys -K C-a z
bind й send-keys -K C-a q

run-shell ~/.config/tmux/plugins/tpm/tpm

# --- Keybinding picker (fuzzy list-keys) ---
bind -N "Search keybindings" ? display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/keys-picker.sh

# --- workmux (git worktree + tmux window per task) ---
bind -N "workmux menu" C-w display-menu -x C -y C -T " workmux " \
  "add"          a "popup -d '#{pane_current_path}' -w 80% -h 20% -E '~/.config/tmux/scripts/workmux.sh add'" \
  "add w/branch" b "popup -d '#{pane_current_path}' -w 80% -h 60% -E '~/.config/tmux/scripts/workmux.sh branch'" \
  "add w/prompt" p "popup -d '#{pane_current_path}' -w 80% -h 20% -E '~/.config/tmux/scripts/workmux.sh prompt'" \
  "open"         o "popup -d '#{pane_current_path}' -w 80% -h 60% -E '~/.config/tmux/scripts/workmux.sh open'" \
  "close"        c "popup -d '#{pane_current_path}' -w 80% -h 60% -E '~/.config/tmux/scripts/workmux.sh close'" \
  "remove"       r "popup -d '#{pane_current_path}' -w 80% -h 60% -E '~/.config/tmux/scripts/workmux.sh remove'" \
  "" \
  "dashboard"    d "popup -d '#{pane_current_path}' -w 90% -h 90% -E 'workmux dashboard'" \
  "sidebar"      s "run-shell 'workmux sidebar'" \
  "" \
  "quit"         q ""
bind -N "workmux dashboard" C-s display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "workmux dashboard"
# Same look as <leader>gg in nvim: reuse the theme snacks.nvim derives from the active colorscheme
bind -N "lazygit (cwd)" g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "LG_CONFIG_FILE=$HOME/.config/lazygit/config.yml,$HOME/.cache/nvim/lazygit-theme.yml lazygit"
bind -N "lazydocker (cwd)" D display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazydocker"
bind -N "Reload config" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind -T copy-mode-vi v send-keys -X begin-selection
# Russian layout mirrors
bind C-ц send-keys -K C-a C-w
bind C-ы send-keys -K C-a C-s
bind п send-keys -K C-a g
bind В send-keys -K C-a D
bind к send-keys -K C-a r
