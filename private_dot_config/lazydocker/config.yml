# Same colours as ~/.cache/nvim/lazygit-theme.yml (Material Darker via snacks.nvim)
# so lazygit and lazydocker match. Regenerate that file by opening lazygit from nvim.
gui:
  border: "rounded"  # matches the tmux popup border
  theme:
    activeBorderColor:
      - "#f78c6c"
      - bold
    inactiveBorderColor:
      - "#82aaff"
    selectedLineBgColor:
      - "#353535"
    optionsTextColor:
      - "#82aaff"
